syntax = "proto3";

package inari.agent.v1;

option go_package = "github.com/7K-Inari/inari-api/gen/go/inari/agent/v1;agentv1";

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "inari/agent/v1/events.proto";

// Server→agent command payloads carried in Event.payload (plan §4.3, §5.2).
// Delivery is at-least-once: every command carries a command_id that
// doubles as the idempotency key; handlers must be idempotent and must
// answer with CommandAck/CommandNack. See agent.proto for the package
// compatibility contract.

// CommitPolicy selects how rendered manifests reach tenant Git (per-tenant
// policy, plan §5.3 GitOps decisions).
enum CommitPolicy {
  COMMIT_POLICY_UNSPECIFIED = 0;
  COMMIT_POLICY_DIRECT_COMMIT = 1;
  COMMIT_POLICY_PULL_REQUEST = 2;
}

// CommandResult is the outcome reported in a CommandAck.
enum CommandResult {
  COMMAND_RESULT_UNSPECIFIED = 0;
  // Accepted and queued by the agent.
  COMMAND_RESULT_ACCEPTED = 1;
  // Fully applied in the tenant environment.
  COMMAND_RESULT_APPLIED = 2;
  // Failed; message carries the reason.
  COMMAND_RESULT_FAILED = 3;
}

// GitTarget identifies a repository + path rendered output is written to.
// The default is the platform-owned `<tenant>-inari-state` repository
// (plan §5.3 GitOps decisions); application repos stay untouched.
message GitTarget {
  string repo = 1;
  string path = 2;
  // Branch for direct commits, or base branch for pull requests.
  string branch = 3;

  reserved 100 to 199;
}

// ApplyBundle directs the agent to render a bundle (Helm/KRO/plain manifests)
// and write it to tenant Git (plan §5.3 step "Reconcile desired state").
message ApplyBundle {
  string command_id = 1;
  oneof source {
    // Signed OCI artifact reference, e.g. oci://registry/bundle:v1.2.3.
    string oci_ref = 2;
    // Git source URL for bundle content.
    string git_url = 3;
  }
  GitTarget target = 4;
  CommitPolicy policy = 5;
  // Expected content checksum; the agent verifies before applying.
  string checksum = 6;

  reserved 100 to 199;
}

// ApplicationSource describes the ArgoCD Application source.
message ApplicationSource {
  string repo_url = 1;
  string path = 2;
  // Helm chart name when the source is a chart instead of a path.
  string chart = 3;
  string target_revision = 4;

  reserved 100 to 199;
}

// SyncPolicy mirrors the ArgoCD Application sync policy knobs Inari manages.
message SyncPolicy {
  bool automated = 1;
  bool self_heal = 2;
  bool prune = 3;

  reserved 100 to 199;
}

// RegisterArgoCDApp directs the agent to register (or update/remove) a
// tenant-local ArgoCD Application (plan §5.3).
message RegisterArgoCDApp {
  string command_id = 1;
  string name = 2;
  string project = 3;
  ApplicationSource source = 4;
  string destination_server = 5;
  string destination_namespace = 6;
  SyncPolicy sync_policy = 7;

  reserved 100 to 199;
}

// InvokeAction is an imperative out-of-band operation (sync/refresh/rollback,
// ArgoCD resource actions incl. Lua custom actions) executed through the
// tenant-local ArgoCD API, scoped to Inari-managed resources. The agent must
// fail closed when disconnected (plan §5.3).
message InvokeAction {
  string command_id = 1;
  string action = 2;
  ResourceRef resource = 3;
  google.protobuf.Struct parameters = 4;
  google.protobuf.Duration timeout = 5;

  reserved 100 to 199;
}

// RenderRgdInstance directs the agent to render a KRO ResourceGraphDefinition
// instance and write it to tenant Git (plan §5.2 Orchestrator, §5.5).
message RenderRgdInstance {
  string command_id = 1;
  // Signed OCI reference of the RGD package from inari-catalog.
  string rgd_ref = 2;
  string instance_name = 3;
  string target_namespace = 4;
  google.protobuf.Struct parameters = 5;
  GitTarget target = 6;
  CommitPolicy policy = 7;

  reserved 100 to 199;
}

// CommandAck reports the outcome of a command back to the gateway. Sent as an
// agent→server event (EVENT_TYPE_COMMAND_ACK or, with
// COMMAND_RESULT_FAILED, EVENT_TYPE_COMMAND_NACK).
message CommandAck {
  string command_id = 1;
  CommandResult result = 2;
  string message = 3;

  reserved 100 to 199;
}
