syntax = "proto3";

package inari.agent.v1;

option go_package = "github.com/7K-Inari/inari-api/gen/go/inari/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";

// RedeemUserCredentialRequest asks the control plane to exchange an opaque credential
// reference (carried on a command, e.g. InvokeAction.user_credential_ref)
// for a short-lived bearer token.
message RedeemUserCredentialRequest {
  // Opaque reference issued by the control plane. Command payloads are
  // persisted (agent_commands.payload), so only this reference is stored,
  // never a token.
  string credential_ref = 1;
}

// RedeemUserCredentialResponse returns the redeemed credential. Redemption is single-use,
// bound to the calling cluster, and expires with the originating command's
// timeout.
message RedeemUserCredentialResponse {
  string bearer_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// AgentCredentialsService lets an in-cluster agent redeem per-user credential
// references for short-lived bearer tokens (per-user Git social login).
// Calls are authenticated with the same per-cluster OIDC identity as the
// EventStream (plan §5.3); the control plane never pushes credentials.
service AgentCredentialsService {
  rpc RedeemUserCredential(RedeemUserCredentialRequest) returns (RedeemUserCredentialResponse);
}
