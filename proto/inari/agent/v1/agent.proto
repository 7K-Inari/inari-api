syntax = "proto3";

package inari.agent.v1;

option go_package = "github.com/7K-Inari/inari-api/gen/go/inari/agent/v1;agentv1";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// Event is the CloudEvents-style envelope exchanged on the agent EventStream
// (platform plan §4.3). Concrete payloads land in M1.
message Event {
  string event_id = 1;
  string resource_id = 2;
  // Reverse-DNS event type, e.g. inari.agent.heartbeat.v1.
  string type = 3;
  google.protobuf.Any payload = 4;
  google.protobuf.Timestamp time = 5;
}

// HandshakeRequest opens a session; the agent always dials out to the control
// plane (pull, never push).
message HandshakeRequest {
  string agent_version = 1;
  string tenant_id = 2;
}

message HandshakeResponse {
  string session_id = 1;
}

// ConnectRequest carries one Event from agent to gateway on the stream.
message ConnectRequest {
  Event event = 1;
}

// ConnectResponse carries one Event from gateway to agent on the stream.
message ConnectResponse {
  Event event = 1;
}

// EventStreamService is the bidirectional gRPC stream between an in-cluster
// agent and the Agent Gateway (platform plan §5.2). Placeholder; full
// protocol lands in M1.
service EventStreamService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}
