name: ci

on:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true

      - name: buf lint
        run: buf lint

      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: |
          if ! git ls-tree --name-only origin/main | grep -qx proto; then
            echo "no proto baseline on main yet; skipping breaking check"
          else
            buf breaking --against ".git#branch=origin/main"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install codegen tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci --include=dev

      - name: OpenAPI lint
        run: npx redocly lint openapi/openapi.yaml

      - name: Codegen drift check
        run: |
          make generate
          git diff --exit-code

      - name: Go build / vet / test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: TS client compiles
        run: npx tsc --noEmit
