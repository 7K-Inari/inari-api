name: release

# Detects a merged Release PR (release-please action self-detection — robust
# under merge-commit and squash alike), creates tag + GitHub Release, then
# runs verify/publish jobs gated on the action's outputs. No tag-push
# triggers, no manual releases.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  verify:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Enforce semver version
        run: |
          echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            || { echo "version $VERSION is not semver (X.Y.Z)"; exit 1; }

      - name: Go module path consistent with major version
        run: |
          MAJOR="${VERSION%%.*}"
          MODULE=$(go mod edit -json | grep -oP '"Path":\s*"\K[^"]+')
          if [ "$MAJOR" -ge 2 ]; then
            case "$MODULE" in */v"$MAJOR") ;; *) echo "go.mod module $MODULE missing /v$MAJOR suffix"; exit 1;; esac
          fi

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install codegen tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci --include=dev

      - name: Full CI gate
        run: make ci

      - name: Version matches package.json
        run: |
          test "$(npm pkg get version | tr -d '"')" = "$VERSION"

  publish-npm:
    needs: [release, verify]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no long-lived tokens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm CLI >= 11.5.1 (Node >= 22.14).
      - name: Ensure npm CLI >= 11.5.1
        run: npm install -g npm@^11  # trusted publishing needs >= 11.5.1; npm@12 needs newer Node than some runners carry
      - run: npm ci --include=dev
      # OIDC is detected automatically; provenance is generated by default
      # for public repos + public packages. Requires the trusted publisher
      # configured on npmjs.com: org 7K-Inari, repo inari-api,
      # workflow filename release.yml, action "npm publish".
      - name: Publish npm package (OIDC trusted publishing)
        run: npm publish --access public

  notify-go:
    needs: [release, verify]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Go module published by tag
        run: |
          echo "Go consumers resolve this release directly from the git tag:"
          echo "  go get github.com/7K-Inari/inari-api@v${{ needs.release.outputs.version }}"
