name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce semver tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            || { echo "tag $TAG is not semver (vX.Y.Z)"; exit 1; }

      - name: Go module path consistent with major version
        run: |
          MAJOR="${GITHUB_REF_NAME#v}"; MAJOR="${MAJOR%%.*}"
          MODULE=$(go mod edit -json | grep -oP '"Path":\s*"\K[^"]+')
          if [ "$MAJOR" -ge 2 ]; then
            case "$MODULE" in */v"$MAJOR") ;; *) echo "go.mod module $MODULE missing /v$MAJOR suffix"; exit 1;; esac
          fi

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install codegen tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci --include=dev

      - name: Full CI gate
        run: make ci

      - name: Tag version matches package.json
        run: |
          test "$(npm pkg get version | tr -d '"')" = "${GITHUB_REF_NAME#v}"

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci --include=dev
      - name: Publish npm package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Requires the NPM_TOKEN repository secret; configure it before the first tag.

  notify-go:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Go module published by tag
        run: |
          echo "Go consumers resolve this release directly from the git tag:"
          echo "  go get github.com/7K-Inari/inari-api@${GITHUB_REF_NAME}"
