name: edge

# Per-merge edge releases: every push to main publishes the npm client as
# <pending>-<shortsha> under the `edge` dist-tag and cuts a GitHub
# prerelease (the v-prefixed prerelease tag doubles as a Go module ref).
# Skipped on release merges — release.yml covers that commit.
#
# npm trusted-publishing note: OIDC trusted publishers are bound to the
# workflow FILENAME — npmjs.com must list .github/workflows/edge.yml as a
# trusted publisher for this repo (same as release.yml) or the publish step
# below fails with an auth error.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: edge-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Skip on release merges
        id: gate
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          parent2=""
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            parent2="$(git log -1 --pretty=%s HEAD^2)"
          fi
          if echo "$msg" | grep -qiE '^chore(\(.*\))?: release' \
             || echo "$parent2" | grep -qiE '^chore(\(.*\))?: release'; then
            echo "release merge detected ($msg) — skipping edge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      edge: ${{ steps.v.outputs.edge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve edge version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "edge=$(scripts/resolve-edge-version.sh .)" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Ensure npm CLI >= 11.5.1
        run: npm install -g npm@^11
      - run: npm ci --include=dev
      - name: Set edge version
        env:
          EDGE: ${{ needs.version.outputs.edge }}
        run: npm version "$EDGE" --no-git-tag-version
      - name: Publish npm package under the edge dist-tag (OIDC trusted publishing)
        run: npm publish --access public --tag edge

  prerelease:
    needs: [version, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create edge prerelease + move the edge channel tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDGE: ${{ needs.version.outputs.edge }}
        run: |
          set -euo pipefail
          if gh release view "v${EDGE}" > /dev/null 2>&1; then
            echo "prerelease v${EDGE} already exists — skipping create (workflow rerun)"
          else
            gh release create "v${EDGE}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "edge ${EDGE}" \
              --notes "Edge build from ${GITHUB_SHA}. npm: \`@7k-inari/api-client@${EDGE}\` (dist-tag \`edge\`); Go: \`go get github.com/7K-Inari/inari-api@v${EDGE}\`. Superseded by the next stable vX.Y.Z release."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          if gh release view edge > /dev/null 2>&1; then
            gh release edit edge --prerelease --title "edge (v${EDGE})" \
              --notes "Latest edge build: \`v${EDGE}\` (${GITHUB_SHA})."
          else
            gh release create edge --prerelease --target "$GITHUB_SHA" \
              --title "edge (v${EDGE})" \
              --notes "Latest edge build: \`v${EDGE}\` (${GITHUB_SHA})."
          fi
