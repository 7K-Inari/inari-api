components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
      additionalProperties: false
    AWSSMProvider:
      additionalProperties: false
      properties:
        authSecretRef:
          $ref: "#/components/schemas/SecretRef"
        region:
          type: string
      required:
        - region
        - authSecretRef
      type: object
    AccessInfoOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AccessInfoOutputBody.json
        accessInfo:
          $ref: "#/components/schemas/ClusterAccessInfo"
      required:
        - accessInfo
      type: object
    AccountOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AccountOutputBody.json
        account:
          $ref: "#/components/schemas/CloudAccount"
      required:
        - account
      type: object
    AddMemberInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AddMemberInputBody.json
        subject:
          description: Keycloak user id
          minLength: 1
          type: string
      required:
        - subject
      type: object
    AddonView:
      additionalProperties: false
      properties:
        argocdApp:
          type: string
        availableVersions:
          items:
            type: string
          type: array
          nullable: true
        catalogItem:
          type: string
        chartVersion:
          type: string
        clusterId:
          type: string
        clusterSelector:
          additionalProperties:
            type: string
          type: object
        commitSha:
          type: string
        createdAt:
          format: date-time
          type: string
        deployMode:
          type: string
        discoveredMeta: {}
        health:
          type: string
        id:
          type: string
        namespace:
          type: string
        orgId:
          type: string
        prUrl:
          type: string
        pruneEnabled:
          type: boolean
        repoId:
          type: string
        repoPath:
          type: string
        source:
          $ref: "#/components/schemas/SourceDescriptor"
        state:
          type: string
        sync:
          type: string
        updatedAt:
          format: date-time
          type: string
        values: {}
      required:
        - id
        - orgId
        - clusterId
        - catalogItem
        - state
        - deployMode
        - source
        - pruneEnabled
        - createdAt
        - updatedAt
      type: object
    AdoptInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AdoptInputBody.json
        clusterSelector:
          additionalProperties:
            type: string
          description: fleet label query (applicationset mode); empty = all org clusters
          type: object
        deployMode:
          enum:
            - application
            - applicationset
          type: string
        namespace:
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        repoId:
          description: tenant_git_repos row id; empty = the cluster's bound baseline
          type: string
        values: {}
        version:
          description: catalog version (= chart version); empty = effective pin/latest stable
          type: string
      type: object
    AdoptOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AdoptOutputBody.json
        addon:
          $ref: "#/components/schemas/ClusterAddon"
        commitSha:
          type: string
        prUrl:
          type: string
      required:
        - addon
      type: object
    AgentChannel:
      additionalProperties: false
      properties:
        channel:
          type: string
        clusterSetId:
          type: string
        createdAt:
          format: date-time
          type: string
        desiredAgentVersion:
          type: string
        id:
          type: string
        orgId:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - orgId
        - clusterSetId
        - channel
        - desiredAgentVersion
        - createdAt
        - updatedAt
      type: object
    AgentCompatStatus:
      additionalProperties: false
      properties:
        recommendedVersion:
          type: string
        supported:
          type: boolean
        upgradeAvailable:
          type: boolean
      required:
        - supported
        - upgradeAvailable
      type: object
    ApprovalConfig:
      additionalProperties: false
      properties:
        approvalTtl:
          type: string
        approverGroups:
          items:
            $ref: "#/components/schemas/ApproverGroup"
          type: array
          nullable: true
        autoApprove:
          items:
            $ref: "#/components/schemas/AutoApproveRule"
          type: array
          nullable: true
        defaultPolicy:
          type: string
        thresholds:
          items:
            $ref: "#/components/schemas/ApprovalThreshold"
          type: array
          nullable: true
      required:
        - defaultPolicy
        - approvalTtl
      type: object
    ApprovalOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ApprovalOutputBody.json
        approval:
          $ref: "#/components/schemas/ApprovalRequest"
      required:
        - approval
      type: object
    ApprovalRequest:
      additionalProperties: false
      properties:
        action:
          type: string
        approver:
          type: string
        cancelledBy:
          type: string
        channel:
          type: string
        clusterId:
          type: string
        createdAt:
          format: date-time
          type: string
        decidedAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        instanceId:
          type: string
        itemId:
          type: string
        name:
          type: string
        namespace:
          type: string
        orgId:
          type: string
        ownerTeam:
          type: string
        reason:
          type: string
        repoId:
          type: string
        requester:
          type: string
        spec: {}
        state:
          type: string
        version:
          type: string
      required:
        - id
        - orgId
        - itemId
        - version
        - clusterId
        - spec
        - requester
        - state
        - createdAt
      type: object
    ApprovalThreshold:
      additionalProperties: false
      properties:
        gt:
          format: double
          type: number
        kind:
          type: string
        policy:
          type: string
      required:
        - kind
        - gt
        - policy
      type: object
    ApproverGroup:
      additionalProperties: false
      properties:
        name:
          type: string
        subjects:
          items:
            type: string
          type: array
          nullable: true
      required:
        - name
        - subjects
      type: object
    AssignPackInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AssignPackInputBody.json
        targetId:
          type: string
        targetType:
          description: clusterset | tenant | cluster
          type: string
      required:
        - targetType
        - targetId
      type: object
    AssignPackOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AssignPackOutputBody.json
        assignment:
          $ref: "#/components/schemas/PolicyAssignment"
      required:
        - assignment
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        action:
          type: string
        actor:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        impersonator:
          type: string
        objectId:
          type: string
        objectType:
          type: string
        orgId:
          type: string
        payload: {}
      required:
        - id
        - orgId
        - actor
        - action
        - objectType
        - objectId
        - createdAt
      type: object
    AuthorizeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AuthorizeInputBody.json
        apiBase:
          description: GHE/self-hosted API base (must be allowlisted); empty = github.com
          type: string
      type: object
    AuthorizeURLBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AuthorizeURLBody.json
        authorizeUrl:
          type: string
      required:
        - authorizeUrl
      type: object
    AutoApproveRule:
      additionalProperties: false
      properties:
        itemIds:
          items:
            type: string
          type: array
          nullable: true
        kind:
          type: string
      required:
        - kind
        - itemIds
      type: object
    AzureKVProvider:
      additionalProperties: false
      properties:
        authSecretRef:
          $ref: "#/components/schemas/SecretRef"
        tenantId:
          type: string
        vaultUrl:
          type: string
      required:
        - vaultUrl
        - authSecretRef
      type: object
    Binding:
      additionalProperties: false
      properties:
        baseBranch:
          type: string
        baselineRepoId:
          type: string
        clusterId:
          type: string
        commitPolicy:
          type: string
        renderer:
          type: string
      type: object
    BrokeredIdP:
      additionalProperties: false
      properties:
        alias:
          type: string
        claimMapping:
          $ref: "#/components/schemas/IdPClaimMapping"
        clientId:
          type: string
        createdAt:
