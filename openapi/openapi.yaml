        labelSelector:
          additionalProperties:
            type: string
          type: object
      required:
        - labelSelector
      type: object
    BulkResultsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/BulkResultsOutputBody.json
        results:
          items:
            $ref: "#/components/schemas/BulkItemResult"
          type: array
          nullable: true
      required:
        - results
      type: object
    Capability:
      additionalProperties: false
      properties:
        clusterId:
          type: string
        deletedAt:
          format: date-time
          type: string
        firstSeenAt:
          format: date-time
          type: string
        group:
          type: string
        id:
          type: string
        kind:
          type: string
        lastSeenAt:
          format: date-time
          type: string
        managementMode:
          type: string
        name:
          type: string
        schema: {}
        uiHints: {}
        version:
          type: string
      required:
        - id
        - clusterId
        - kind
        - name
        - managementMode
        - firstSeenAt
        - lastSeenAt
      type: object
    CapabilityRef:
      additionalProperties: false
      properties:
        group:
          type: string
        kind:
          type: string
        name:
          type: string
      required:
        - kind
        - name
      type: object
    CatalogItemVersion:
      additionalProperties: false
      properties:
        channel:
          type: string
        id:
          type: string
        itemId:
          type: string
        payload: {}
        schema: {}
        uiHints: {}
        version:
          type: string
      required:
        - id
        - itemId
        - version
        - channel
      type: object
    ChannelOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ChannelOutputBody.json
        channel:
          $ref: "#/components/schemas/AgentChannel"
      required:
        - channel
      type: object
    ClaimMappingInput:
      additionalProperties: false
