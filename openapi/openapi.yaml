openapi: 3.0.3
info:
  title: Inari Control Plane API
  version: 0.1.0
  description: |
    REST surface of the Inari control plane for console and CLI clients
    (platform plan §4.3). Agents use the gRPC EventStream contract instead.
    All operations are tenant-scoped via the X-Inari-Tenant-ID header.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
security:
  - bearerAuth: []
servers:
  - url: /api/v1
tags:
  - name: meta
    description: Service metadata and liveness endpoints.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      tags: [meta]
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReady
      summary: Readiness probe
      security: []
      tags: [meta]
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Inari-Tenant-ID
      in: header
      required: true
      description: Tenant scope for the request (tenant-aware to the core).
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
      additionalProperties: false
