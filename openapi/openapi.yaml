        name:
          maxLength: 63
          minLength: 1
          type: string
        redirectUris:
          items:
            type: string
          type: array
        scopes:
          items:
            type: string
          type: array
      type: object
    UpdateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/UpdateInputBody.json
        enabled:
          type: boolean
        events:
          items:
            type: string
          type: array
          nullable: true
        name:
          type: string
        secret:
          type: string
        url:
          type: string
      type: object
    UpdatePolicyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/UpdatePolicyInputBody.json
        enabled:
          type: boolean
        source:
          type: string
      required:
        - source
        - enabled
      type: object
    UpdateTenantInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/UpdateTenantInputBody.json
        displayName:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - displayName
      type: object
    UpgradeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/UpgradeInputBody.json
        toVersion:
          minLength: 1
          type: string
      required:
        - toVersion
      type: object
    VisibilityInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/VisibilityInputBody.json
        rules:
          items:
            $ref: "#/components/schemas/Item"
          type: array
          nullable: true
      required:
        - rules
      type: object
    AccessInfoOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AccessInfoOutputBody.json
          format: uri
          readOnly: true
          type: string
        accessInfo:
          $ref: "#/components/schemas/ClusterAccessInfo"
      required:
        - accessInfo
      type: object
    ClusterAccessInfo:
      additionalProperties: false
      properties:
        audience:
          type: string
        issuerUrl:
          type: string
        kubectlClientId:
          type: string
        organization:
          type: string
      required:
        - issuerUrl
        - kubectlClientId
        - audience
        - organization
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: Inari Control Plane API
  version: 0.1.0
  description: |
    REST surface of the Inari control plane for console and CLI clients
    (platform plan §4.3). Agents use the gRPC EventStream contract instead.
    All operations are tenant-scoped.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      tags: [meta]
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReady
      summary: Readiness probe
      security: []
      tags: [meta]
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/admin/catalog/sync:
    post:
      operationId: syncCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Sync curated packages from the catalog registry (platform engineer)
  /api/v1/admin/catalog/{item}/visibility:
    put:
      operationId: setCatalogVisibility
      parameters:
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisibilityInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Set per-tenant/cluster visibility rules (platform engineer)
  /api/v1/approvals/inbox:
    get:
      operationId: inboxApprovals
      parameters:
        - description: Max items to return (default 50, max 200)
          explode: false
          in: query
          name: limit
          schema:
            description: Max items to return (default 50, max 200)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List pending approvals across all orgs the caller belongs to
  /api/v1/tenants:
    get:
      operationId: listTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTenantsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List tenants visible to the caller (tenant switcher)
    post:
      operationId: createTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create a tenant (Keycloak Organization + default teams)
  /api/v1/tenants/{org}:
    delete:
      operationId: deleteTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteTenantInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTenantOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Decommission a tenant (org admin only; approval-gated, asynchronous)
    get:
      operationId: getTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a tenant by slug
    patch:
      operationId: updateTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Update the tenant profile (org admin only)
  /api/v1/tenants/{org}/agent-channels:
    get:
      operationId: listAgentChannels
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List agent channel pins
  /api/v1/tenants/{org}/approval-config:
    get:
      operationId: getApprovalConfig
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get the org's effective approval policy config
    put:
      operationId: updateApprovalConfig
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Replace the org's approval policy config
  /api/v1/tenants/{org}/approvals:
    get:
      operationId: listApprovals
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - description: Filter by state (pending|approved|rejected|cancelled|expired)
          explode: false
          in: query
          name: state
          schema:
            description: Filter by state (pending|approved|rejected|cancelled|expired)
            type: string
        - description: Pass 'me' for the caller's own requests (inbox filter)
          explode: false
          in: query
          name: requester
          schema:
            description: Pass 'me' for the caller's own requests (inbox filter)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: "List approval requests (default: pending)"
  /api/v1/tenants/{org}/approvals/{id}:
    get:
      operationId: getApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get one approval request
  /api/v1/tenants/{org}/approvals/{id}/cancel:
    post:
      operationId: cancelApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Withdraw a pending approval request (requester only)
  /api/v1/tenants/{org}/approvals/{id}/decide:
    post:
      operationId: decideApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Approve or reject a pending approval request
  /api/v1/tenants/{org}/bulk/approvals:decide:
    post:
      operationId: bulkDecideApprovals
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDecideInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Bulk approve/reject approvals
  /api/v1/tenants/{org}/bulk/catalog:pin:
    post:
      operationId: bulkPinCatalog
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPinCatalogInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Bulk pin catalog items to a version
  /api/v1/tenants/{org}/bulk/clusters:query:
    post:
      operationId: bulkQueryClusters
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkQueryInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Label query across the fleet
  /api/v1/tenants/{org}/bulk/policy:assign:
    post:
      operationId: bulkAssignPolicy
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssignPolicyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Bulk assign a policy pack to cluster sets
  /api/v1/tenants/{org}/catalog:
    get:
      operationId: listCatalog
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - description: Cluster ID; intersects discovered capabilities
          explode: false
          in: query
          name: cluster
          schema:
            description: Cluster ID; intersects discovered capabilities
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCatalogOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List catalog items visible to the tenant (optionally per cluster)
  /api/v1/tenants/{org}/catalog-visibility:
    get:
      operationId: listCatalogVisibility
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOrgVisibilityOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List effective catalog visibility for the tenant (platform rule AND org overlay)
  /api/v1/tenants/{org}/catalog-visibility/{item}:
    put:
      operationId: setCatalogOrgVisibility
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgVisibilityInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Set the org-level visibility overlay for one catalog item (org admin)
  /api/v1/tenants/{org}/catalog/{item}:
    get:
      operationId: getCatalogItem
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: cluster
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a catalog item with schema, UI hints, and versions
  /api/v1/tenants/{org}/catalog/{item}/pin:
    delete:
      operationId: unpinCatalogVersion
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: cluster
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Remove the tenant's version pin
    put:
      operationId: pinCatalogVersion
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Pin the tenant to a catalog item version
  /api/v1/tenants/{org}/cloud-accounts:
    get:
      operationId: listCloudAccounts
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccountsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List cloud accounts of a tenant
    post:
      operationId: registerCloudAccount
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Register a cloud account (role ARN + external ID, never keys)
  /api/v1/tenants/{org}/cloud-accounts/{id}:
    delete:
      operationId: deregisterCloudAccount
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Delete the control-plane record (AWS-side role deletion is tenant-owned)
    get:
      operationId: getCloudAccount
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a cloud account
  /api/v1/tenants/{org}/cloud-accounts/{id}/providerconfig:
    get:
      operationId: renderCloudAccountProviderConfig
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Cluster to render the ProviderConfig for
          explode: false
          in: query
          name: clusterId
          required: true
          schema:
            description: Cluster to render the ProviderConfig for
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
                format: byte
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Render the Crossplane ProviderConfig manifest for a cluster
  /api/v1/tenants/{org}/cloud-accounts/{id}/validate:
    post:
      operationId: validateCloudAccount
      parameters:
        - in: path
          name: org
