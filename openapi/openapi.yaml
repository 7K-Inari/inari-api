        roleArn:
          type: string
        runContext:
          type: string
        state:
          type: string
        validatedAt:
          format: date-time
          type: string
        validationError:
          type: string
      required:
        - id
        - orgId
        - provider
        - accountId
        - roleArn
        - runContext
        - state
        - createdAt
      type: object
    Cluster:
      additionalProperties: false
      properties:
