          type: string
        targetSchema: {}
        targetVersion:
          type: string
      required:
        - instanceId
        - itemId
        - currentVersion
        - targetVersion
        - currentManifest
        - targetManifest
      type: object
    EndpointOutputBody:
      additionalProperties: false
      properties:
        $schema:
