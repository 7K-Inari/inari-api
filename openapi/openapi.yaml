components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
      additionalProperties: false
    AccountOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AccountOutputBody.json
        account:
          $ref: "#/components/schemas/CloudAccount"
      required:
        - account
      type: object
    AddMemberInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AddMemberInputBody.json
        subject:
          description: Keycloak user id
          minLength: 1
          type: string
      required:
        - subject
      type: object
    AgentChannel:
      additionalProperties: false
      properties:
        channel:
          type: string
        clusterSetId:
          type: string
        createdAt:
          format: date-time
          type: string
        desiredAgentVersion:
          type: string
        id:
          type: string
        orgId:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - orgId
        - clusterSetId
        - channel
        - desiredAgentVersion
        - createdAt
        - updatedAt
      type: object
    ApprovalConfig:
      additionalProperties: false
      properties:
        approvalTtl:
          type: string
        approverGroups:
          items:
            $ref: "#/components/schemas/ApproverGroup"
          type: array
          nullable: true
        autoApprove:
          items:
            $ref: "#/components/schemas/AutoApproveRule"
          type: array
          nullable: true
        defaultPolicy:
          type: string
        thresholds:
          items:
            $ref: "#/components/schemas/ApprovalThreshold"
          type: array
          nullable: true
      required:
        - defaultPolicy
        - approvalTtl
      type: object
    ApprovalOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ApprovalOutputBody.json
        approval:
          $ref: "#/components/schemas/ApprovalRequest"
      required:
        - approval
      type: object
    ApprovalRequest:
      additionalProperties: false
      properties:
        action:
          type: string
        approver:
          type: string
        cancelledBy:
          type: string
        channel:
          type: string
        clusterId:
          type: string
        createdAt:
          format: date-time
          type: string
        decidedAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        instanceId:
          type: string
        itemId:
          type: string
        name:
          type: string
        namespace:
          type: string
        orgId:
          type: string
        ownerTeam:
          type: string
        reason:
          type: string
        requester:
          type: string
        spec: {}
        state:
          type: string
        version:
          type: string
      required:
        - id
        - orgId
        - itemId
        - version
        - clusterId
        - spec
        - requester
        - state
        - createdAt
      type: object
    ApprovalThreshold:
      additionalProperties: false
      properties:
        gt:
          format: double
          type: number
        kind:
          type: string
        policy:
          type: string
      required:
        - kind
        - gt
        - policy
      type: object
    ApproverGroup:
      additionalProperties: false
      properties:
        name:
          type: string
        subjects:
          items:
            type: string
          type: array
          nullable: true
      required:
        - name
        - subjects
      type: object
    AssignPackInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AssignPackInputBody.json
        targetId:
          type: string
        targetType:
          description: clusterset | tenant | cluster
          type: string
      required:
        - targetType
        - targetId
      type: object
    AssignPackOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AssignPackOutputBody.json
        assignment:
          $ref: "#/components/schemas/PolicyAssignment"
      required:
        - assignment
      type: object
    AutoApproveRule:
      additionalProperties: false
      properties:
        itemIds:
          items:
            type: string
          type: array
          nullable: true
        kind:
          type: string
      required:
        - kind
        - itemIds
      type: object
    BrokeredIdP:
      additionalProperties: false
      properties:
        alias:
          type: string
        claimMapping:
          $ref: "#/components/schemas/IdPClaimMapping"
        clientId:
          type: string
        createdAt:
          format: date-time
          type: string
        domainHints:
          items:
            type: string
          type: array
          nullable: true
        issuerUrl:
          type: string
      required:
        - alias
        - issuerUrl
        - clientId
        - claimMapping
        - domainHints
        - createdAt
      type: object
    BrokeredIdPOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/BrokeredIdPOutputBody.json
        provider:
          $ref: "#/components/schemas/BrokeredIdP"
      required:
        - provider
      type: object
    BulkAssignPolicyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/BulkAssignPolicyInputBody.json
        clusterSetIds:
          items:
            type: string
          type: array
          nullable: true
        packId:
          type: string
      required:
        - packId
        - clusterSetIds
      type: object
    BulkDecideInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/BulkDecideInputBody.json
        approvalIds:
          items:
            type: string
          type: array
          nullable: true
        approve:
          type: boolean
        reason:
          type: string
      required:
        - approvalIds
        - approve
      type: object
    BulkItemResult:
      additionalProperties: false
      properties:
        error:
          type: string
        id:
          type: string
        ok:
          type: boolean
      required:
        - id
        - ok
      type: object
    BulkPinCatalogInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/BulkPinCatalogInputBody.json
        itemIds:
          items:
            type: string
          type: array
          nullable: true
        version:
          type: string
      required:
        - itemIds
        - version
      type: object
    BulkQueryInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/BulkQueryInputBody.json
        labelSelector:
          additionalProperties:
            type: string
          type: object
      required:
        - labelSelector
      type: object
    BulkResultsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/BulkResultsOutputBody.json
        results:
          items:
            $ref: "#/components/schemas/BulkItemResult"
          type: array
          nullable: true
      required:
        - results
      type: object
    Capability:
      additionalProperties: false
      properties:
        clusterId:
          type: string
        deletedAt:
          format: date-time
          type: string
        firstSeenAt:
          format: date-time
          type: string
        group:
          type: string
        id:
          type: string
        kind:
          type: string
        lastSeenAt:
          format: date-time
          type: string
        managementMode:
          type: string
        name:
          type: string
        schema: {}
        uiHints: {}
        version:
          type: string
      required:
        - id
        - clusterId
        - kind
        - name
        - managementMode
        - firstSeenAt
        - lastSeenAt
      type: object
    CapabilityRef:
      additionalProperties: false
      properties:
        group:
          type: string
        kind:
          type: string
        name:
          type: string
      required:
        - kind
        - name
      type: object
    CatalogItemVersion:
      additionalProperties: false
      properties:
        channel:
          type: string
        id:
          type: string
        itemId:
          type: string
        payload: {}
        schema: {}
        uiHints: {}
        version:
          type: string
      required:
        - id
        - itemId
        - version
        - channel
      type: object
    ChannelOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ChannelOutputBody.json
        channel:
          $ref: "#/components/schemas/AgentChannel"
      required:
        - channel
      type: object
    ClaimMappingInput:
      additionalProperties: false
      properties:
        email:
          description: Claim carrying the user email (defaults to the IdP's standard mapping)
          type: string
        groups:
          description: Claim carrying group memberships, mapped into the tenant members group
          type: string
      type: object
    CloudAccount:
      additionalProperties: false
      properties:
        accountId:
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        externalId:
          type: string
        id:
          type: string
        issuerUrl:
          type: string
        orgId:
          type: string
        provider:
          type: string
        roleArn:
          type: string
        runContext:
          type: string
        state:
          type: string
        validatedAt:
          format: date-time
          type: string
        validationError:
          type: string
      required:
        - id
        - orgId
        - provider
        - accountId
        - roleArn
        - runContext
        - state
        - createdAt
      type: object
    Cluster:
      additionalProperties: false
      properties:
        capabilityChecksum:
          type: string
        connectedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        distribution:
          type: string
        id:
          type: string
        keycloakClientId:
          type: string
        kubernetesVersion:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lastSeenAt:
          format: date-time
          type: string
        name:
          type: string
        oidcIssuerUrl:
          type: string
        orgId:
          type: string
        state:
          type: string
      required:
        - id
        - orgId
        - name
        - state
        - createdAt
      type: object
    ClusterOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ClusterOutputBody.json
        cluster:
          $ref: "#/components/schemas/Cluster"
      required:
        - cluster
      type: object
    ClusterSet:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        labelSelector:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        orgId:
          type: string
      required:
        - id
        - orgId
        - name
        - labelSelector
        - createdAt
      type: object
    ClusterSetOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ClusterSetOutputBody.json
        clusterSet:
          $ref: "#/components/schemas/ClusterSet"
      required:
        - clusterSet
      type: object
    ConfigOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ConfigOutputBody.json
        config:
          $ref: "#/components/schemas/ApprovalConfig"
        orgId:
          type: string
        updatedAt:
          format: date-time
          type: string
          nullable: true
      required:
        - config
        - orgId
        - updatedAt
      type: object
    CreateBrokeredIdPInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateBrokeredIdPInputBody.json
        alias:
          description: URL-safe IdP alias (KC alias becomes org-<org>-<alias>)
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        claimMapping:
          $ref: "#/components/schemas/ClaimMappingInput"
        clientId:
          minLength: 1
          type: string
        clientSecret:
          description: "Write-only: forwarded to Keycloak, never stored or returned"
          minLength: 1
          type: string
        domainHints:
          description: Org email domains used for home-IdP discovery
          items:
            type: string
          type: array
          nullable: true
        issuerUrl:
          description: OIDC issuer URL (https); discovered via the discovery endpoint
          minLength: 1
          type: string
      required:
        - alias
        - issuerUrl
        - clientId
        - clientSecret
      type: object
    CreateClusterInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateClusterInputBody.json
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateClusterSetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateClusterSetInputBody.json
        labelSelector:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
      required:
        - name
        - labelSelector
      type: object
    CreateIdentityClientInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateIdentityClientInputBody.json
        audiences:
          items:
            type: string
          type: array
          nullable: true
        name:
          description: URL-safe client name (clientId becomes org-<org>-<name>)
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        redirectUris:
          items:
            type: string
          type: array
          nullable: true
        scopes:
          items:
            type: string
          type: array
          nullable: true
        type:
          description: service = confidential client-credentials; public = browser/native with redirect URIs
          enum:
            - service
            - public
          type: string
      required:
        - name
        - type
      type: object
    CreateIdentityClientOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateIdentityClientOutputBody.json
        client:
          $ref: "#/components/schemas/IdentityClient"
        secret:
          description: Returned exactly once; never stored server-side
          type: string
      required:
        - client
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateInputBody.json
        enabled:
          type: boolean
        events:
          description: Empty = all events
          items:
            type: string
          type: array
          nullable: true
        kind:
          description: slack | webhook
          type: string
        name:
          type: string
        secret:
          type: string
        url:
          type: string
      required:
        - name
        - kind
        - url
      type: object
    CreatePackInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreatePackInputBody.json
        engine:
          description: kyverno | cel-vap
          type: string
        manifests: {}
        name:
          type: string
        ociRef:
          type: string
        parameters: {}
        version:
          type: string
      required:
        - name
        - engine
        - version
        - manifests
      type: object
    CreatePolicyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreatePolicyInputBody.json
        engine:
          description: rego
          type: string
        name:
          type: string
        source:
          description: Rego source (package inari.policy)
          type: string
        target:
          description: request | render
          type: string
      required:
        - name
        - target
        - engine
        - source
      type: object
    CreateRolloutInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateRolloutInputBody.json
        desiredVersion:
          type: string
        kind:
          description: capability | policy_pack | agent_upgrade | catalog_version
          type: string
        name:
          type: string
        stages:
          items:
            $ref: "#/components/schemas/RolloutStage"
          type: array
          nullable: true
        targetRef:
          type: string
      required:
        - name
        - kind
        - targetRef
        - desiredVersion
        - stages
      type: object
    CreateTeamInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateTeamInputBody.json
        name:
          description: URL-safe team name
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        role:
          description: Org role the team grants (default viewer)
          type: string
      required:
        - name
      type: object
    CreateTenantInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateTenantInputBody.json
        displayName:
          maxLength: 200
          minLength: 1
          type: string
        slug:
          description: URL-safe tenant slug
          maxLength: 63
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
      required:
        - slug
        - displayName
      type: object
    DecideExemptionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecideExemptionInputBody.json
        approve:
          type: boolean
      required:
        - approve
      type: object
    DecideInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecideInputBody.json
        approve:
          type: boolean
        reason:
          type: string
      required:
        - approve
      type: object
    DecideOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecideOutputBody.json
        approval:
          $ref: "#/components/schemas/ApprovalRequest"
      required:
        - approval
      type: object
    DecommissionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecommissionInputBody.json
        force:
          description: Drain even when non-Inari-managed resources exist (§10 override)
          type: boolean
      type: object
    DecommissionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecommissionOutputBody.json
        cluster:
          $ref: "#/components/schemas/Cluster"
        drainedInstanceIds:
          items:
            type: string
          type: array
          nullable: true
      required:
        - cluster
        - drainedInstanceIds
      type: object
    DecommissionOutputBody1:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecommissionOutputBody1.json
        approvalId:
          type: string
      type: object
    DeleteTenantInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DeleteTenantInputBody.json
        force:
          description: Revoke non-terminal clusters and delete despite dependencies
          type: boolean
        reason:
          maxLength: 500
          type: string
      type: object
    DeleteTenantOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DeleteTenantOutputBody.json
        approvalId:
          type: string
        status:
          type: string
      required:
        - approvalId
        - status
      type: object
    DeletionDependenciesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DeletionDependenciesOutputBody.json
        blockers:
          items:
            $ref: "#/components/schemas/Dependency"
          type: array
          nullable: true
      required:
        - blockers
      type: object
    Dependency:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        state:
          type: string
      required:
        - kind
        - id
        - name
        - state
      type: object
    DeployInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DeployInputBody.json
        channel:
          type: string
        clusterId:
          minLength: 1
          type: string
        itemId:
          minLength: 1
          type: string
        name:
          description: Instance name (DNS-1123 label); becomes the instance ID and repo path segment
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        namespace:
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        ownerTeam:
          type: string
        spec: {}
        version:
          type: string
      required:
        - itemId
        - clusterId
        - spec
      type: object
    DeployOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
