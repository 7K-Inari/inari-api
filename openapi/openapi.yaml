        - clientId
        - claimMapping
        - domainHints
        - createdAt
      type: object
    BrokeredIdPOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/BrokeredIdPOutputBody.json
        provider:
          $ref: "#/components/schemas/BrokeredIdP"
      required:
        - provider
      type: object
    BulkAssignPolicyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
