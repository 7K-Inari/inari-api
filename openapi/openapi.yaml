        state:
          type: string
      required:
        - id
        - orgId
        - name
        - state
        - createdAt
      type: object
    ClusterAccessInfo:
      additionalProperties: false
      properties:
        audience:
          type: string
        issuerUrl:
          type: string
        kubectlAccessEnabled:
          type: boolean
        kubectlClientId:
          type: string
        organization:
          type: string
        proxyUrl:
          type: string
        tunnelAvailable:
          type: boolean
        tunnelUnavailableReason:
          type: string
      required:
        - issuerUrl
        - kubectlClientId
        - audience
        - organization
        - kubectlAccessEnabled
        - tunnelAvailable
      type: object
    ClusterAddon:
      additionalProperties: false
      properties:
        argocdApp:
          type: string
        catalogItem:
          type: string
        chartVersion:
          type: string
        clusterId:
          type: string
        clusterSelector:
          additionalProperties:
            type: string
          type: object
        commitSha:
          type: string
        createdAt:
          format: date-time
          type: string
        deployMode:
          type: string
        discoveredMeta: {}
        health:
          type: string
        id:
          type: string
        namespace:
          type: string
        orgId:
          type: string
        prUrl:
          type: string
        pruneEnabled:
          type: boolean
        repoId:
          type: string
        repoPath:
          type: string
        source:
          $ref: "#/components/schemas/SourceDescriptor"
        state:
          type: string
        sync:
          type: string
        updatedAt:
          format: date-time
          type: string
        values: {}
      required:
        - id
        - orgId
        - clusterId
        - catalogItem
        - state
        - deployMode
        - source
        - pruneEnabled
        - createdAt
        - updatedAt
      type: object
    ClusterOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ClusterOutputBody.json
        cluster:
          $ref: "#/components/schemas/Cluster"
      required:
        - cluster
      type: object
    ClusterSet:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        labelSelector:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        orgId:
          type: string
      required:
        - id
        - orgId
        - name
        - labelSelector
        - createdAt
      type: object
    ClusterSetOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ClusterSetOutputBody.json
        clusterSet:
          $ref: "#/components/schemas/ClusterSet"
      required:
        - clusterSet
      type: object
    ConfigOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ConfigOutputBody.json
        config:
          $ref: "#/components/schemas/ApprovalConfig"
        orgId:
          type: string
        updatedAt:
          format: date-time
          type: string
          nullable: true
      required:
        - config
        - orgId
        - updatedAt
      type: object
    Connection:
      additionalProperties: false
      properties:
        apiBase:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        lastUsedAt:
          format: date-time
          type: string
        orgId:
          type: string
        provider:
          type: string
        providerLogin:
          type: string
        scopes:
          type: string
      required:
        - id
        - orgId
        - provider
        - providerLogin
        - scopes
        - createdAt
      type: object
    CreateBrokeredIdPInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateBrokeredIdPInputBody.json
        alias:
          description: URL-safe IdP alias (KC alias becomes org-<org>-<alias>)
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        claimMapping:
          $ref: "#/components/schemas/ClaimMappingInput"
        clientId:
          minLength: 1
          type: string
        clientSecret:
          description: "Write-only: forwarded to Keycloak, never stored or returned"
          minLength: 1
          type: string
        domainHints:
          description: Org email domains used for home-IdP discovery
          items:
            type: string
          type: array
          nullable: true
        issuerUrl:
          description: OIDC issuer URL (https); discovered via the discovery endpoint
          minLength: 1
          type: string
      required:
        - alias
        - issuerUrl
        - clientId
        - clientSecret
      type: object
    CreateClusterInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateClusterInputBody.json
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateClusterSetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
