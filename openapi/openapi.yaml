info:
  title: Inari Control Plane API
  version: 0.1.0
  description: |
    REST surface of the Inari control plane for console and CLI clients
    (platform plan §4.3). Agents use the gRPC EventStream contract instead.
    All operations are tenant-scoped.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      tags: [meta]
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReady
      summary: Readiness probe
      security: []
      tags: [meta]
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/admin/catalog/sync:
    post:
      operationId: syncCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Sync curated packages from the catalog registry (platform engineer)
  /api/v1/admin/catalog/{item}/visibility:
    put:
      operationId: setCatalogVisibility
      parameters:
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisibilityInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Set per-tenant/cluster visibility rules (platform engineer)
  /api/v1/tenants:
    get:
      operationId: listTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTenantsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List tenants visible to the caller (tenant switcher)
    post:
      operationId: createTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create a tenant (Keycloak Organization + default teams)
  /api/v1/tenants/{org}:
    get:
      operationId: getTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a tenant by slug
  /api/v1/tenants/{org}/approvals:
    get:
      operationId: listApprovals
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - description: Filter by state (pending|approved|rejected|cancelled|expired)
          explode: false
          in: query
          name: state
          schema:
            description: Filter by state (pending|approved|rejected|cancelled|expired)
            type: string
        - description: Pass 'me' for the caller's own requests (inbox filter)
          explode: false
          in: query
          name: requester
          schema:
            description: Pass 'me' for the caller's own requests (inbox filter)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: "List approval requests (default: pending)"
  /api/v1/tenants/{org}/approvals/{id}:
    get:
      operationId: getApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get one approval request
  /api/v1/tenants/{org}/approvals/{id}/cancel:
    post:
      operationId: cancelApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Withdraw a pending approval request (requester only)
  /api/v1/tenants/{org}/approvals/{id}/decide:
    post:
      operationId: decideApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Approve or reject a pending approval request
  /api/v1/tenants/{org}/catalog:
    get:
