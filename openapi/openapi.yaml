          readOnly: true
          type: string
          example: https://example.com/schemas/CreateClusterSetInputBody.json
        labelSelector:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
      required:
        - name
        - labelSelector
      type: object
    CreateIdentityClientInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateIdentityClientInputBody.json
        audiences:
          items:
            type: string
          type: array
          nullable: true
        name:
          description: URL-safe client name (clientId becomes org-<org>-<name>)
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        redirectUris:
          items:
            type: string
          type: array
          nullable: true
        scopes:
          items:
            type: string
          type: array
          nullable: true
        type:
          description: service = confidential client-credentials; public = browser/native with redirect URIs
          enum:
            - service
            - public
          type: string
      required:
        - name
        - type
      type: object
    CreateIdentityClientOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateIdentityClientOutputBody.json
        client:
          $ref: "#/components/schemas/IdentityClient"
        secret:
          description: Returned exactly once; never stored server-side
          type: string
      required:
        - client
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateInputBody.json
        capability:
          minLength: 1
          type: string
        config: {}
        isDefault:
          type: boolean
        name:
          maxLength: 100
          minLength: 1
          type: string
        resourceRef:
          $ref: "#/components/schemas/TargetResourceRef"
      required:
        - name
        - resourceRef
        - capability
      type: object
    CreateInputBody1:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
