          type: string
        id:
          type: string
        ok:
          type: boolean
      required:
        - id
        - ok
      type: object
    BulkPinCatalogInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/BulkPinCatalogInputBody.json
        itemIds:
          items:
            type: string
          type: array
          nullable: true
        version:
          type: string
      required:
        - itemIds
        - version
      type: object
    BulkQueryInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
