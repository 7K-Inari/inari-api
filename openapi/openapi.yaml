components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
      additionalProperties: false
    AccountOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AccountOutputBody.json
        account:
          $ref: "#/components/schemas/CloudAccount"
      required:
        - account
      type: object
    AddMemberInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AddMemberInputBody.json
        subject:
          description: Keycloak user id
          minLength: 1
          type: string
      required:
        - subject
      type: object
    ApprovalOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ApprovalOutputBody.json
        approval:
          $ref: "#/components/schemas/ApprovalRequest"
      required:
        - approval
      type: object
    ApprovalRequest:
      additionalProperties: false
      properties:
        action:
          type: string
        approver:
          type: string
        cancelledBy:
          type: string
        channel:
          type: string
        clusterId:
          type: string
        createdAt:
          format: date-time
          type: string
        decidedAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        instanceId:
          type: string
        itemId:
          type: string
        name:
          type: string
        namespace:
          type: string
        orgId:
          type: string
        ownerTeam:
          type: string
        reason:
          type: string
        requester:
          type: string
        spec: {}
        state:
          type: string
        version:
          type: string
      required:
        - id
        - orgId
        - itemId
        - version
        - clusterId
        - spec
        - requester
        - state
        - createdAt
      type: object
    AssignPackInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AssignPackInputBody.json
        targetId:
          type: string
        targetType:
          description: clusterset | tenant | cluster
          type: string
      required:
        - targetType
        - targetId
      type: object
    AssignPackOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/AssignPackOutputBody.json
        assignment:
          $ref: "#/components/schemas/PolicyAssignment"
      required:
        - assignment
      type: object
    Capability:
      additionalProperties: false
      properties:
        clusterId:
          type: string
        deletedAt:
          format: date-time
          type: string
        firstSeenAt:
          format: date-time
          type: string
        group:
          type: string
        id:
          type: string
        kind:
          type: string
        lastSeenAt:
          format: date-time
          type: string
        managementMode:
          type: string
        name:
          type: string
        schema: {}
        uiHints: {}
        version:
          type: string
      required:
        - id
        - clusterId
        - kind
        - name
        - managementMode
        - firstSeenAt
        - lastSeenAt
      type: object
    CapabilityRef:
      additionalProperties: false
      properties:
        group:
          type: string
        kind:
          type: string
        name:
          type: string
      required:
        - kind
        - name
      type: object
    CatalogItemVersion:
      additionalProperties: false
      properties:
        channel:
          type: string
        id:
          type: string
        itemId:
          type: string
        payload: {}
        schema: {}
        uiHints: {}
        version:
          type: string
      required:
        - id
        - itemId
        - version
        - channel
      type: object
    CloudAccount:
      additionalProperties: false
      properties:
        accountId:
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        externalId:
          type: string
        id:
          type: string
        issuerUrl:
          type: string
        orgId:
          type: string
        provider:
          type: string
        roleArn:
          type: string
        runContext:
          type: string
        state:
          type: string
        validatedAt:
          format: date-time
          type: string
        validationError:
          type: string
      required:
        - id
        - orgId
        - provider
        - accountId
        - roleArn
        - runContext
        - state
        - createdAt
      type: object
    Cluster:
      additionalProperties: false
      properties:
        capabilityChecksum:
          type: string
        connectedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        distribution:
          type: string
        id:
          type: string
        keycloakClientId:
          type: string
        kubernetesVersion:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lastSeenAt:
          format: date-time
          type: string
        name:
          type: string
        oidcIssuerUrl:
          type: string
        orgId:
          type: string
        state:
          type: string
      required:
        - id
        - orgId
        - name
        - state
        - createdAt
      type: object
    ClusterOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ClusterOutputBody.json
        cluster:
          $ref: "#/components/schemas/Cluster"
      required:
        - cluster
      type: object
    ClusterSet:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        labelSelector:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        orgId:
          type: string
      required:
        - id
        - orgId
        - name
        - labelSelector
        - createdAt
      type: object
    ClusterSetOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/ClusterSetOutputBody.json
        clusterSet:
          $ref: "#/components/schemas/ClusterSet"
      required:
        - clusterSet
      type: object
    CreateClusterInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateClusterInputBody.json
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateClusterSetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateClusterSetInputBody.json
        labelSelector:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
      required:
        - name
        - labelSelector
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateInputBody.json
        enabled:
          type: boolean
        events:
          description: Empty = all events
          items:
            type: string
          type: array
          nullable: true
        kind:
          description: slack | webhook
          type: string
        name:
          type: string
        secret:
          type: string
        url:
          type: string
      required:
        - name
        - kind
        - url
      type: object
    CreatePackInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreatePackInputBody.json
        engine:
          description: kyverno | cel-vap
          type: string
        manifests: {}
        name:
          type: string
        ociRef:
          type: string
        parameters: {}
        version:
          type: string
      required:
        - name
        - engine
        - version
        - manifests
      type: object
    CreatePolicyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreatePolicyInputBody.json
        engine:
          description: rego
          type: string
        name:
          type: string
        source:
          description: Rego source (package inari.policy)
          type: string
        target:
          description: request | render
          type: string
      required:
        - name
        - target
        - engine
        - source
      type: object
    CreateTenantInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/CreateTenantInputBody.json
        displayName:
          maxLength: 200
          minLength: 1
          type: string
        slug:
          description: URL-safe tenant slug
          maxLength: 63
          minLength: 2
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
      required:
        - slug
        - displayName
      type: object
    DecideExemptionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecideExemptionInputBody.json
        approve:
          type: boolean
      required:
        - approve
      type: object
    DecideInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecideInputBody.json
        approve:
          type: boolean
        reason:
          type: string
      required:
        - approve
      type: object
    DecideOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecideOutputBody.json
        approval:
          $ref: "#/components/schemas/ApprovalRequest"
      required:
        - approval
      type: object
    DecommissionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecommissionInputBody.json
        force:
          description: Drain even when non-Inari-managed resources exist (§10 override)
          type: boolean
      type: object
    DecommissionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecommissionOutputBody.json
        cluster:
          $ref: "#/components/schemas/Cluster"
        drainedInstanceIds:
          items:
            type: string
          type: array
          nullable: true
      required:
        - cluster
        - drainedInstanceIds
      type: object
    DecommissionOutputBody1:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DecommissionOutputBody1.json
        approvalId:
          type: string
      type: object
    DeployInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DeployInputBody.json
        channel:
          type: string
        clusterId:
          minLength: 1
          type: string
        itemId:
          minLength: 1
          type: string
        name:
          description: Instance name (DNS-1123 label); becomes the instance ID and repo path segment
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        namespace:
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
        ownerTeam:
          type: string
        spec: {}
        version:
          type: string
      required:
        - itemId
        - clusterId
        - spec
      type: object
    DeployOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/DeployOutputBody.json
        deploy:
          $ref: "#/components/schemas/DeployResult"
      required:
        - deploy
      type: object
    DeployResult:
      additionalProperties: false
