          type: string
          example: https://example.com/schemas/UpdateInputBody3.json
        provider:
          $ref: "#/components/schemas/SecretStoreProvider"
        targets:
          $ref: "#/components/schemas/SecretStoreTargets"
      type: object
    UpdateInstanceInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/UpdateInstanceInputBody.json
        repoId:
          type: string
        spec: {}
      required:
        - spec
      type: object
    UpdatePolicyInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/UpdatePolicyInputBody.json
        enabled:
          type: boolean
        name:
          description: New policy name (empty keeps the current name; 409 on conflict)
          type: string
        source:
          type: string
        target:
          description: request | render (empty keeps the current target)
          type: string
      required:
        - source
        - enabled
      type: object
    UpdateTeamInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/UpdateTeamInputBody.json
        displayName:
          description: Human-friendly display name (name and Keycloak group path stay immutable)
          maxLength: 200
          type: string
      required:
        - displayName
      type: object
    UpdateTenantInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/UpdateTenantInputBody.json
        displayName:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - displayName
      type: object
    UpgradeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/UpgradeInputBody.json
        repoId:
          type: string
        toVersion:
          minLength: 1
          type: string
      required:
        - toVersion
      type: object
    VaultProvider:
      additionalProperties: false
      properties:
        authSecretRef:
          $ref: "#/components/schemas/SecretRef"
        path:
          type: string
        server:
          type: string
      required:
        - server
        - authSecretRef
      type: object
    VisibilityInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/VisibilityInputBody.json
        rules:
          items:
            $ref: "#/components/schemas/Item"
          type: array
          nullable: true
      required:
        - rules
      type: object
    WebhookOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          format: uri
          readOnly: true
          type: string
          example: https://example.com/schemas/WebhookOutputBody.json
        hookUrl:
          type: string
        provisioned:
          type: boolean
      required:
        - provisioned
      type: object
    XPSource:
      additionalProperties: false
      properties:
        manifests: {}
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: Inari Control Plane API
  version: 0.1.0
  description: |
    REST surface of the Inari control plane for console and CLI clients
    (platform plan §4.3). Agents use the gRPC EventStream contract instead.
    All operations are tenant-scoped.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      tags: [meta]
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReady
      summary: Readiness probe
      security: []
      tags: [meta]
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/admin/catalog/sync:
    post:
      operationId: syncCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Sync curated packages from the catalog registry (platform engineer)
  /api/v1/admin/catalog/{item}/visibility:
    put:
      operationId: setCatalogVisibility
      parameters:
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisibilityInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Set per-tenant/cluster visibility rules (platform engineer)
  /api/v1/approvals/inbox:
    get:
      operationId: inboxApprovals
      parameters:
        - description: Max items to return (default 50, max 200)
          explode: false
          in: query
          name: limit
          schema:
            description: Max items to return (default 50, max 200)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List pending approvals across all orgs the caller belongs to
  /api/v1/me/permissions:
    get:
      operationId: getMyPermissions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPermissionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Platform-level permissions of the authenticated caller
  /api/v1/platform/admins:
    get:
      operationId: listPlatformAdmins
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPlatformAdminsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List platform admins (members of the Keycloak platform admin group)
  /api/v1/platform/admins/{subject}:
    delete:
      operationId: revokePlatformAdmin
      parameters:
        - description: Keycloak user id or email of the user to grant/revoke
          in: path
          name: subject
          required: true
          schema:
            description: Keycloak user id or email of the user to grant/revoke
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Revoke platform admin (leaves the platform admin group; idempotent)
    put:
      operationId: grantPlatformAdmin
      parameters:
        - description: Keycloak user id or email of the user to grant/revoke
          in: path
          name: subject
          required: true
          schema:
            description: Keycloak user id or email of the user to grant/revoke
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Grant platform admin (joins the platform admin group; org_creator tuple converges via PlatformGroupSync)
  /api/v1/platform/feature-flags:
    get:
      operationId: listPlatformFeatureFlags
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFlagsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List the runtime feature-flag catalog with platform effective values
  /api/v1/platform/feature-flags/{key}:
    delete:
      operationId: clearPlatformFeatureFlag
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Revert a platform-scoped feature flag to its built-in default
    put:
      operationId: setPlatformFeatureFlag
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFlagInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Set a platform-scoped feature-flag value
  /api/v1/tenants:
    get:
      operationId: listTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTenantsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List tenants visible to the caller (tenant switcher)
    post:
      operationId: createTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create a tenant (Keycloak Organization + default teams)
  /api/v1/tenants/{org}:
    delete:
      operationId: deleteTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteTenantInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTenantOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Decommission a tenant (org admin only; approval-gated, asynchronous)
    get:
      operationId: getTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a tenant by slug
    patch:
      operationId: updateTenant
      parameters:
        - description: Tenant slug
          in: path
          name: org
          required: true
          schema:
            description: Tenant slug
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Update the tenant profile (org admin only)
  /api/v1/tenants/{org}/addons/{id}:
    delete:
      operationId: deleteAddon
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: "Orphan an addon: stop managing it (row removed; git files and the ArgoCD app keep running)"
    patch:
      operationId: updateAddon
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddonInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Update a managed addon's chart version and/or values (commit per repo policy)
  /api/v1/tenants/{org}/addons/{id}/enable-prune:
    post:
      operationId: enableAddonPrune
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Explicitly enable prune on an adopted addon (audit-logged, one-directional)
  /api/v1/tenants/{org}/agent-channels:
    get:
      operationId: listAgentChannels
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List agent channel pins
  /api/v1/tenants/{org}/approval-config:
    get:
      operationId: getApprovalConfig
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get the org's effective approval policy config
    put:
      operationId: updateApprovalConfig
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Replace the org's approval policy config
  /api/v1/tenants/{org}/approvals:
    get:
      operationId: listApprovals
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - description: Filter by state (pending|approved|rejected|cancelled|expired)
          explode: false
          in: query
          name: state
          schema:
            description: Filter by state (pending|approved|rejected|cancelled|expired)
            type: string
        - description: Pass 'me' for the caller's own requests (inbox filter)
          explode: false
          in: query
          name: requester
          schema:
            description: Pass 'me' for the caller's own requests (inbox filter)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: "List approval requests (default: pending)"
  /api/v1/tenants/{org}/approvals/{id}:
    get:
      operationId: getApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get one approval request
  /api/v1/tenants/{org}/approvals/{id}/cancel:
    post:
      operationId: cancelApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Withdraw a pending approval request (requester only)
  /api/v1/tenants/{org}/approvals/{id}/decide:
    post:
      operationId: decideApproval
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Approve or reject a pending approval request
  /api/v1/tenants/{org}/audit:
    get:
      operationId: listAuditLog
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: actor
          schema:
            type: string
        - explode: false
          in: query
          name: action
          schema:
            type: string
        - explode: false
          in: query
          name: objectType
          schema:
            type: string
        - explode: false
          in: query
          name: from
          schema:
            type: string
        - explode: false
          in: query
          name: to
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditUIOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Org audit log in the console's shape (filterable by actor/action/objectType/from/to)
  /api/v1/tenants/{org}/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - description: Exact action filter, e.g. cluster.created
          explode: false
          in: query
          name: action
          schema:
            description: Exact action filter, e.g. cluster.created
            type: string
        - description: Exact actor (subject) filter
          explode: false
          in: query
          name: actor
          schema:
            description: Exact actor (subject) filter
            type: string
        - description: Max events to return (default 100, max 500)
          explode: false
          in: query
          name: limit
          schema:
            description: Max events to return (default 100, max 500)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEventsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List org audit events, newest first (filterable by action and actor)
  /api/v1/tenants/{org}/audit/export:
    get:
      operationId: exportAuditLog
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: actor
          schema:
            type: string
        - explode: false
          in: query
          name: action
          schema:
            type: string
        - explode: false
          in: query
          name: objectType
          schema:
            type: string
        - explode: false
          in: query
          name: from
          schema:
            type: string
        - explode: false
          in: query
          name: to
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
                format: byte
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Org audit log as CSV (same filters as the list)
  /api/v1/tenants/{org}/authz/self/extensions:
    get:
      operationId: selfExtensionPermissions
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfPermissionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List the caller's effective extension invoke permissions
  /api/v1/tenants/{org}/bulk/approvals:decide:
    post:
      operationId: bulkDecideApprovals
      parameters:
        - in: path
          name: org
          required: true
          schema:
            type: string
